[package]
name = "cfm"
version = "0.1.1"
edition = "2021"
description = "Contextual File Manager — An ephemeral, zero-hostage intelligence layer for the shell"
license = "MIT"
repository = "https://github.com/dracon/cfm"
keywords = ["cli", "file-manager", "shell", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "fm"
path = "src/main.rs"

[[bin]]
name = "cfmd"
path = "src/daemon.rs"

[dependencies]
# CLI parsing
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Rich terminal output
comfy-table = "6"
console = "0.15"
unicode-width = "0.2"

# Fast directory walking
ignore = "0.4"

# Git integration
git2 = "0.19"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Directories
directories = "5"

# Progress bars
indicatif = "0.17"

# Human-readable sizes
byte-unit = "5"

# Date/time
chrono = { version = "0.4", features = ["serde"] }


# Error handling
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"

# Path handling
path-absolutize = "3.1"

# Glob patterns
glob = "0.3"

# Filesystem watching (for daemon)
inotify = "0.11"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
