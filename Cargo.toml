[package]
name = "folder-auto-banner"
version = "0.7.11"
edition = "2021"
description = "Folder Auto Banner — A directory listing with instant context"
license = "MIT"
homepage = "https://github.com/DraconDev/folder-auto-banner-fab"
repository = "https://github.com/DraconDev/folder-auto-banner-fab"
documentation = "https://docs.rs/folder-auto-banner"
keywords = ["cli", "file-manager", "shell", "productivity"]
categories = ["command-line-utilities"]
default-run = "f"
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "INSTALL.md",
    "LICENSE",
    "COMPETITORS.md",
    "VISION.md",
    "AUDIT.md",
    "AUDIT-DAEMON.md",
    "SMART_TREE_FINDINGS.md",
    "benches/**/*.rs",
    "tests/**/*.rs",
    "fabd.service",
    "install.sh",
    "public/**/*",
]

[[bin]]
name = "f"
path = "src/main.rs"

[[bin]]
name = "fabd"
path = "src/daemon.rs"

[dependencies]
# CLI parsing
clap = { version = "4", features = ["derive", "env"] }

# Terminal string width
unicode-width = "0.2"

# Fast directory walking
ignore = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Directories
directories = "6"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling and logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1"

# Filesystem watching (for daemon)
inotify = "0.11"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "performance"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
