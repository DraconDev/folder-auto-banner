name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Re-run a release without re-pushing the tag, e.g. when the publish job
  # fails on a transient error or a missing permission.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # Fail fast instead of burning the 6h default. A hung test step once
    # blocked a release for hours with the `Create Release` job waiting on it.
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "fab-${{ matrix.target }}"

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Run tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/f
            target/${{ matrix.target }}/release/fabd

  publish:
    name: Create Release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Without this the default GITHUB_TOKEN cannot create a release and the
    # job fails with 403 "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      # Every artifact contains a binary called `f` (and `fabd`), so
      # publishing the paths as-is gives all targets the same asset name and
      # the last one uploaded silently replaces the others. Name them per
      # architecture, so a download is unambiguous and `f`/`fabd` always come
      # from the same build.
      - name: Name binaries per architecture
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            arch="${target%%-*}"
            for bin in f fabd; do
              test -f "f-$target/$bin" || {
                echo "::error::missing f-$target/$bin — the release matrix changed"
                exit 1
              }
              mv "f-$target/$bin" "$bin-$arch-linux"
            done
          done
          ls -l
          for bin in f fabd; do
            for arch in x86_64 aarch64; do
              test -x "$bin-$arch-linux" || { echo "::error::$bin-$arch-linux missing"; exit 1; }
            done
          done

      # Notes files are named after the version without the `v` prefix
      # (RELEASE_NOTES_0.7.16.md) while the ref is `v0.7.16`, so resolve the
      # path rather than assuming, and fall back to a minimal body.
      - name: Resolve release notes
        id: notes
        run: |
          set -euo pipefail
          notes="docs/releases/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          if [ ! -f "$notes" ]; then
            echo "::warning::no release notes at $notes — using a generated body"
            printf 'Release %s\n\nSee CHANGELOG.md for details.\n' \
              "$GITHUB_REF_NAME" > /tmp/release-body.md
            notes=/tmp/release-body.md
          fi
          echo "using $notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            f-x86_64-linux
            fabd-x86_64-linux
            f-aarch64-linux
            fabd-aarch64-linux
          # Fail if an asset is missing rather than replacing an existing one:
          # a silently overwritten architecture is worse than a failed run.
          overwrite_files: false
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
